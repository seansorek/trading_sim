
name: Daily Trading Predictions

on:
  schedule:
    - cron: "0 6 * * *"   # Every day at 06:00 UTC
  push:
    branches:
      - main
  workflow_dispatch:       # Manual trigger

# Serialize state-mutating runs. The scheduled 06:00 UTC run and a manual
# workflow_dispatch both read predictions/portfolio.jsonl as starting state
# and later commit+push predictions/. Without this, an overlapping
# manual/scheduled run can race: both read the same portfolio state, the
# first push advances main, the second fails non-fast-forward after already
# generating output and (for schedule/workflow_dispatch) posting to Discord,
# and one run's state transition is silently dropped. `cancel-in-progress:
# false` means a second trigger queues and waits rather than cancelling the
# in-flight run outright, so no run is dropped and the runner does not need
# force-push/rebase gymnastics to reconcile two runs computed off the same
# stale book.
#
# Manual verification: trigger `workflow_dispatch` twice back to back (e.g.
# `gh workflow run simulation.yaml` twice within a few seconds, or fire one
# manually while the 06:00 UTC schedule is about to run) and confirm in the
# Actions tab that the second run shows "Queued"/waiting on the concurrency
# group until the first completes, rather than both running concurrently.
concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    # The job fetches bars for the union of panel.universe (159 ranked names)
    # and prediction.symbols (30 watchlist names) on an ephemeral runner with
    # no DB cache — ~1s/symbol against yfinance, plus retry/backoff.
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-predict.txt

      - name: Generate next-day predictions
        run: python predict_next_day_lite.py
        env:
          # Only the scheduled daily run and manual dispatch are "real" runs
          # that should notify Discord. A push to main still executes this
          # script as a smoke test (catches load/runtime errors before the
          # next scheduled run) but must not post a live trading signal.
          DISCORD_WEBHOOK_URL: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && secrets.DISCORD_WEBHOOK_URL || '' }}

      # portfolio.jsonl is not just a record — it is the state the next run
      # reads to decide whether to hold or rebalance. Losing it means
      # re-ranking every day, which the walk-forward shows costs 1.4-2.7 Sharpe.
      - name: Commit predictions history and portfolio book
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Whole directory, not named files: portfolio.jsonl does not exist
          # until the first run that builds a book, and `git add` on a missing
          # pathspec fails the step.
          git add predictions/
          if git diff --cached --quiet; then
            echo "No history changes to commit"
          else
            git commit -m "chore: record daily predictions $(date -u +%Y-%m-%d)"
            # Defense in depth only: the concurrency group above already
            # serializes schedule/workflow_dispatch runs, so main should not
            # have moved since checkout and this push should succeed on the
            # first try. If it still fails (e.g. an unrelated commit landed
            # on main mid-run), rebase our single predictions commit onto
            # the new tip and retry once rather than force-pushing over it.
            # We deliberately do not re-run prediction generation here -
            # under normal (serialized) operation this path should not
            # trigger at all.
            if ! git push; then
              echo "Push rejected, retrying once after rebasing onto latest main"
              git fetch origin main
              if git rebase origin/main; then
                if ! git push; then
                  echo "::error::Push still failed after rebase retry. Manual intervention required to reconcile predictions/ state."
                  exit 1
                fi
              else
                echo "::error::Rebase onto latest main failed (likely a conflict in predictions/). Manual intervention required."
                git rebase --abort
                exit 1
              fi
            fi
          fi

      - name: Log completion
        run: |
          echo "[ok] Daily trading predictions completed at $(date)"
