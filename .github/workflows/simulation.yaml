
name: Build & Publish Simulation Dashboard

on:
  schedule:
    - cron: "0 6 * * 1"   # Every Monday at 06:00 UTC
  workflow_dispatch:       # Manual trigger

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Explicitly ensure these are present
          pip install yfinance pandas numpy matplotlib

      - name: Run multi-symbol simulation
        run: |
          python simulate_multi.py

      - name: Send dashboard to Discord
        run: |
          python - << 'EOF'
          import json
          import requests
          import os
          from collections import Counter
          
          # Read the multi_summary to extract recommendations
          with open('results/multi_summary.json', 'r') as f:
              multi_summary = json.load(f)
          
          # Count recommendations
          buy_count = 0
          hold_count = 0
          sell_count = 0
          strategies_summary = []
          
          for symbol, symdata in multi_summary.items():
              for strat in symdata.get("strategies", []):
                  strat_data = symdata.get(strat, {})
                  rec = strat_data.get("recommendation", "NO_DATA")
                  if rec == "BUY":
                      buy_count += 1
                  elif rec == "HOLD":
                      hold_count += 1
                  elif rec == "SELL":
                      sell_count += 1
                  strategies_summary.append(f"{symbol} ({strat}): {rec}")
          
          # Prepare Discord message
          webhook_url = "${{ secrets.DISCORD_WEBHOOK_URL }}"
          
          # Build recommendations summary
          rec_summary = f"🟢 BUY: {buy_count} | 🟡 HOLD: {hold_count} | 🔴 SELL: {sell_count}"
          
          payload = {
              "content": "📊 Trading Simulation Dashboard Updated",
              "embeds": [{
                  "title": "Simulation Results",
                  "description": "Dashboard has been generated and is ready for review.",
                  "color": 3447003,
                  "fields": [
                      {
                          "name": "Recommendations Summary",
                          "value": rec_summary,
                          "inline": False
                      },
                      {
                          "name": "Status",
                          "value": "✅ Complete",
                          "inline": True
                      }
                  ]
              }],
              "file": None
          }
          
          # Send message
          response = requests.post(webhook_url, json=payload)
          if response.status_code == 204:
              print("Discord notification sent successfully!")
          else:
              print(f"Failed to send Discord notification: {response.status_code}")
          
          # For file upload, use multipart form data
          with open('./site/index.html', 'rb') as f:
              files = {'file': ('dashboard.html', f)}
              response = requests.post(webhook_url, files=files)
              if response.status_code == 204:
                  print("HTML file uploaded to Discord!")
              else:
                  print(f"Failed to upload file: {response.status_code}")
          EOF
