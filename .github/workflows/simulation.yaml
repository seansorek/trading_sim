
name: Daily Trading Predictions

on:
  schedule:
    - cron: "0 7 * * *"   # Every day at 07:00 UTC
  workflow_dispatch:       # Manual trigger

permissions:
  contents: read

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate next-day predictions
        run: |
          python predict_next_day.py \
            --symbols AAPL,SPY,MSFT,GOOGL,NVDA,TSLA,META,NFLX,AMD,INTC,AVGO,ADBE,CSCO,CRM,DXCM \
            --webhook
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        continue-on-error: true

      - name: Log completion
        run: |
          echo "✅ Daily trading predictions completed"
