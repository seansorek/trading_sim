
name: Build & Publish Simulation Dashboard

on:
  schedule:
    - cron: "0 6 * * 1"   # Every Monday at 06:00 UTC
  workflow_dispatch:       # Manual trigger

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Explicitly ensure these are present
          pip install yfinance pandas numpy matplotlib

      - name: Run multi-symbol simulation
        run: |
          python simulate_multi.py

      - name: Send dashboard to Discord
        run: |
          python - << 'EOF'
          import json
          import requests
          import os
          
          # Read the recommendations summary (sorted by stock)
          with open('results/recommendations_summary.json', 'r') as f:
              recommendations = json.load(f)
          
          # Read trade history statistics
          trade_stats = {}
          if os.path.exists('results/trade_history/statistics.json'):
              with open('results/trade_history/statistics.json', 'r') as f:
                  trade_stats = json.load(f)
          
          # Count totals
          buy_count = 0
          hold_count = 0
          sell_count = 0
          
          # Build detailed recommendations message
          rec_details = []
          for symbol in sorted(recommendations.keys()):
              rec_details.append(f"**{symbol}**")
              for strat in sorted(recommendations[symbol].keys()):
                  rec = recommendations[symbol][strat]
                  emoji = "🟢" if rec == "BUY" else "🟡" if rec == "HOLD" else "🔴" if rec == "SELL" else "⚪"
                  rec_details.append(f"  {emoji} {strat}: {rec}")
                  
                  if rec == "BUY":
                      buy_count += 1
                  elif rec == "HOLD":
                      hold_count += 1
                  elif rec == "SELL":
                      sell_count += 1
          
          rec_details_str = "\n".join(rec_details)
          rec_summary = f"🟢 BUY: {buy_count} | 🟡 HOLD: {hold_count} | 🔴 SELL: {sell_count}"
          
          # Build trade history summary
          trade_summary = "No trade history yet"
          if trade_stats and 'overall' in trade_stats:
              overall = trade_stats['overall']
              total_trades = trade_stats.get('total_trades', 0)
              total_pnl = overall.get('total_pnl', 0)
              win_rate = overall.get('win_rate', 0)
              profit_factor = overall.get('profit_factor', 0)
              
              trade_summary = (
                  f"📊 **Historical Trade Audit Trail**\n"
                  f"Total Trades: {total_trades}\n"
                  f"Win Rate: {win_rate*100:.1f}%\n"
                  f"Total P&L: ${total_pnl:,.2f}\n"
                  f"Profit Factor: {profit_factor:.2f}" if profit_factor != float('inf') else "Profit Factor: ∞"
              )
              
              # Add top performers by symbol
              if 'by_symbol' in trade_stats and trade_stats['by_symbol']:
                  top_symbols = sorted(
                      trade_stats['by_symbol'].items(),
                      key=lambda x: x[1].get('total_pnl', 0),
                      reverse=True
                  )[:3]
                  if top_symbols:
                      trade_summary += "\n\n**Top Symbols:**"
                      for symbol, stats in top_symbols:
                          pnl = stats.get('total_pnl', 0)
                          trade_summary += f"\n  {symbol}: ${pnl:,.2f}"
              
              # Add top performers by strategy
              if 'by_strategy' in trade_stats and trade_stats['by_strategy']:
                  top_strats = sorted(
                      trade_stats['by_strategy'].items(),
                      key=lambda x: x[1].get('total_pnl', 0),
                      reverse=True
                  )[:3]
                  if top_strats:
                      trade_summary += "\n\n**Top Strategies:**"
                      for strat, stats in top_strats:
                          pnl = stats.get('total_pnl', 0)
                          trade_summary += f"\n  {strat}: ${pnl:,.2f}"
          
          # Prepare Discord message
          webhook_url = "${{ secrets.DISCORD_WEBHOOK_URL }}"
          
          payload = {
              "content": "📊 Trading Simulation Dashboard Updated",
              "embeds": [{
                  "title": "Simulation Results",
                  "description": "Dashboard has been generated and is ready for review.",
                  "color": 3447003,
                  "fields": [
                      {
                          "name": "Recommendations Summary",
                          "value": rec_summary,
                          "inline": False
                      },
                      {
                          "name": "Detailed Recommendations",
                          "value": f"```\n{rec_details_str}\n```",
                          "inline": False
                      },
                      {
                          "name": "Trade History Summary",
                          "value": trade_summary,
                          "inline": False
                      },
                      {
                          "name": "Status",
                          "value": "✅ Complete",
                          "inline": True
                      }
                  ]
              }],
              "file": None
          }
          
          # Send message
          response = requests.post(webhook_url, json=payload)
          if response.status_code == 204:
              print("Discord notification sent successfully!")
          else:
              print(f"Failed to send Discord notification: {response.status_code}")
          
          # For file upload, use multipart form data
          with open('./site/index.html', 'rb') as f:
              files = {'file': ('dashboard.html', f)}
              response = requests.post(webhook_url, files=files)
              if response.status_code == 204:
                  print("HTML file uploaded to Discord!")
              else:
                  print(f"Failed to upload file: {response.status_code}")
          EOF
