
name: Daily Trading Predictions

on:
  schedule:
    - cron: "0 6 * * *"   # Every day at 06:00 UTC
  push:
    branches:
      - main
  workflow_dispatch:       # Manual trigger

permissions:
  contents: read

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-predict.txt

      - name: Generate next-day predictions
        run: |
          python predict_next_day_lite.py \
            --symbols AAPL,SPY,MSFT,GOOGL,NVDA,TSLA,META,NFLX,AMD,INTC,AVGO,ADBE,CSCO,CRM,DXCM,QQQ,IWM,GLD,USO,XLF,XLV,XLE,XLY,XLI,COIN,RIOT,MARA,SOXL,TQQQ,UPRO
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Log completion
        run: |
          echo "[ok] Daily trading predictions completed at $(date)"
