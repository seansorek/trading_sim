[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading_sim"
version = "2.0.0"
description = "Daily ML trading simulator with XGBoost, Logistic Regression, and DQN strategies."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<4",
    "pyyaml>=6.0,<7",
    "yfinance>=0.2.40,<2",
    "scikit-learn>=1.4,<2",
    "xgboost>=2.0,<4",
    "torch>=2.2,<3",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<8",
]

[project.scripts]
trading-sim-train = "trading_sim.cli.train:main"
trading-sim-predict = "trading_sim.cli.predict:main"
trading-sim-simulate = "trading_sim.cli.simulate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests that require network access",
]
