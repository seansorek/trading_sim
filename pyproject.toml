[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading_sim"
version = "2.0.0"
description = "Daily ML trading simulator with XGBoost, Logistic Regression, and DQN strategies."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<4",
    "pyyaml>=6.0,<7",
    "yfinance>=0.2.40,<2",
    "scikit-learn>=1.4,<2",
    "xgboost>=2.0,<4",
    "torch>=2.2,<3",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<8",
]

[tool.setuptools]
py-modules = [
    "base_strategy",
    "config",
    "daily_features",
    "data_loader",
    "db",
    "dqn_agent",
    "dqn_signal",
    "hybrid_model",
    "ml_strategies",
    "predict_next_day_lite",
    "predictor_strategy",
    "rl_env",
    "signal_monitor",
    "simulate_multi",
    "simulation_pipeline",
    "train_hybrid",
    "train_models",
    "train_predictor",
    "walk_forward",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests that require network access",
]
