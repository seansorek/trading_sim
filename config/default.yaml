# Symbol universe for the daily prediction job and Discord notifications.
# Edit `symbols` to change what gets sent to Discord — no workflow YAML edit needed.
# Edit `models` to add/remove a model from the live pipeline — no code change needed
# (predict_next_day_lite.py loads exactly this list; a model missing its pickle is
# logged and skipped, not a hard failure). See models/README.md for what each does.
prediction:
  max_model_age_days: 30
  models:
    - daily_logistic
    - daily_xgboost
    - daily_predictor
  symbols:
    - AAPL
    - SPY
    - MSFT
    - GOOGL
    - NVDA
    - TSLA
    - META
    - NFLX
    - AMD
    - INTC
    - AVGO
    - ADBE
    - CSCO
    - CRM
    - DXCM
    - QQQ
    - IWM
    - GLD
    - USO
    - XLF
    - XLV
    - XLE
    - XLY
    - XLI
    - COIN
    - RIOT
    - MARA
    - SOXL
    - TQQQ
    - UPRO

# Data fetching defaults.
data:
  source: yfinance        # yfinance | csv
  interval: "1d"          # Daily bars only in v2.
  history_days: 1000      # How many days of history to load per symbol.
  cache_dir: data/cache
  database_path: data/trading_sim.db

# Backtest execution model.
execution:
  start_cash: 100000.0
  commission_per_share: 0.00005
  slippage_bps: 1.0
  max_position_pct: 0.05       # 5% of equity per trade.
  # Barriers scale with each name's own volatility: stop at 2x ATR-14 at entry,
  # target at 4x (same 1:2 risk/reward as the fixed 5%/10% it replaces, but a
  # comparable *number of typical moves* on SPY and TSLA rather than a
  # comparable percentage). Set both to 0.0 to fall back to the fixed pcts
  # below — that is the A/B baseline.
  stop_loss_atr_mult: 2.0
  take_profit_atr_mult: 4.0
  stop_loss_pct: 0.05          # fallback: used when the *_atr_mult are 0, and
  take_profit_pct: 0.10        # during the ATR-14 warmup window.
  # Vertical barrier — force flat after 3 bars, matching
  # daily_features.FWD_RET_HORIZON_DAYS, the horizon every predictor is fit on.
  # Holding past it is a bet on nothing the model forecast. 0 disables.
  max_holding_bars: 3
  daily_loss_limit_pct: 0.05
  holding_period_days: 5       # Minimum bars between position changes.

# Per-strategy thresholds and hyperparameters.
strategies:
  logistic:
    confidence_threshold: 0.55
    pos_threshold: 0.002
    neg_threshold: -0.002
    C: 1.0
    max_iter: 1000
  xgboost:
    confidence_threshold: 0.55
    pos_threshold: 0.002
    neg_threshold: -0.002
    n_estimators: 200
    max_depth: 4
    learning_rate: 0.03
    subsample: 0.85
    colsample_bytree: 0.85
    min_child_weight: 2
    gamma: 1.0
  dqn:
    window: 20
    hidden: 256
    gamma: 0.99
    lr: 0.0005
    batch_size: 64
    buffer_size: 200000
    epsilon_start: 1.0
    epsilon_end: 0.05
    epsilon_decay_steps: 100000
    target_update_interval: 2500
    episodes: 30
    steps_per_episode: 500
    q_advantage_threshold: 1.0
    confidence_threshold: 2.0
    transaction_cost_bps: 5.0

# Bayesian hyperparameter search settings (used when --optimize is passed to train_models.py).
optimize:
  n_iter: 25          # Bayesian search iterations per model
  cv: 3               # Cross-validation folds

  logistic:
    C: [0.001, 100.0]       # log-uniform range for regularization strength
    penalty: [l1, l2]

  xgboost:
    n_estimators: [100, 600]
    max_depth: [2, 7]
    learning_rate: [0.005, 0.3]   # log-uniform
    subsample: [0.5, 1.0]
    colsample_bytree: [0.5, 1.0]
    gamma: [0.0, 5.0]
    min_child_weight: [1, 10]
    reg_alpha: [0.0, 2.0]         # L1 regularization
    reg_lambda: [0.5, 10.0]       # L2 regularization

# Output paths (relative to project root).
paths:
  models_dir: models_output
  results_dir: results_output

# Discord webhook (optional). Reads DISCORD_WEBHOOK_URL env var if not set.
discord:
  enabled: true
  username: "Trading Sim"

# Cross-sectional panel backtester (research-only — not part of the live
# prediction path). See docs/superpowers/specs/2026-07-15-step3-panel-portfolio-design.md
#
# universe is STOCKS ONLY. Index/sector ETFs (SPY, QQQ, XL*) are baskets of
# these same names — ranking a stock against a fund that holds it is not a
# cross-sectional bet. SPY still loads for ret_*_vs_spy features and the
# gate's beta regression, but is never ranked or held.
panel:
  decile: 0.1               # top/bottom fraction of the cross-section
  rebalance_days: 1         # daily
  gross_exposure: 1.0       # 0.5 long + 0.5 short; net exposure 0
  cost_bps: 5.0             # one-way cost on turnover notional (ASSUMPTION, not a tunable)
  borrow_bps_annual: 50.0   # flat GC-style rate on short notional
  min_names: 20             # below this, hold no position that day
  # Sector membership is the source of truth for the panel universe:
  # config.load_config flattens these lists into panel.universe, so a symbol
  # cannot be traded without a sector, and the two can never drift apart.
