# Trading simulator configuration

# Symbol universe for model training and backtesting.
# Mirrors panel.sectors (below) plus the three index ETFs the live prediction job
# serves, so the forecaster is fit on the same breadth it is asked to rank. A
# 10-name training set gave per-year OOS IC swinging -0.014..+0.096; at this width
# the same walk-forward lands in +0.017..+0.057, i.e. mostly estimation noise gone.
# NOTE: simulate_multi.py defaults to this list too — pass --symbols for quick runs.
